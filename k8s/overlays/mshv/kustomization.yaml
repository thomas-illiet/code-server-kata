apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: code-server-podman
    patch: |-
      - op: replace
        path: /spec/template/spec/runtimeClassName
        value: kata-clh-azure-runtime-rs
  - target:
      version: v1
      kind: Service
      name: code-server
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30443
