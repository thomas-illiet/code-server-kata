apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server-podman
spec:
  tls:
    - hosts:
        - code-server.example.invalid
      secretName: code-server-tls
  rules:
    - host: code-server.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server
                port:
                  name: http
