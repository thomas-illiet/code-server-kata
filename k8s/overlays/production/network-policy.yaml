apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-server-ingress
  namespace: code-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: code-server-podman
  policyTypes:
    - Ingress
  ingress:
    # Allow probes and in-namespace clients.
    - from:
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP
    # Label the namespace containing the ingress controller with
    # code-server-ingress=allowed before applying this overlay.
    - from:
        - namespaceSelector:
            matchLabels:
              code-server-ingress: allowed
      ports:
        - port: http
          protocol: TCP
